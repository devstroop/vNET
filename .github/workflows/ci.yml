name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig build.zig.zon fuzz.zig src test.zig exec

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: test "$(zig version)" = "0.16.0"
      - run: zig build test
      - run: zig build
      - run: zig build web
      - run: zig build web-test
      - run: for f in examples/*.json; do ./zig-out/bin/vnet validate "$f"; done

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: test "$(zig version)" = "0.16.0"
      - run: zig build fuzz --fuzz=10K

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - aarch64-linux-android
          - arm-linux-androideabi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: test "$(zig version)" = "0.16.0"
      - run: zig build -Dtarget=${{ matrix.target }}

  netns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: test "$(zig version)" = "0.16.0"
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_netns.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_route.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_tun.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_journal.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_crash.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/nat_matrix.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_firewall.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_vlan.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_offload.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_dhcp.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/test_dns.sh
      - run: sudo env "PATH=$PATH" "ZIG=$(command -v zig)" bash scripts/soak.sh --duration 30s --interval 2 --flap-interval 5 --restart-interval 10

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: bash scripts/package.sh --out dist --rpm
      - run: |
          version="$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -n1)"
          test -f "dist/vnet_${version}_amd64.deb"
          test -f "dist/vnet-${version}-linux-amd64.tar.gz"
          test -f "dist/vnet-${version}-1.x86_64.rpm"
          ar t "dist/vnet_${version}_amd64.deb"
          tar -tzf "dist/vnet-${version}-linux-amd64.tar.gz" >/dev/null
          rpm -qpl "dist/vnet-${version}-1.x86_64.rpm" >/dev/null
          tar -xzf "dist/vnet-${version}-linux-amd64.tar.gz" -C /tmp
          "/tmp/vnet-${version}/usr/bin/vnet" version

  zig-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build
      - run: zig build test
